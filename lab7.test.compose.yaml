services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lab7tests
      POSTGRES_USER: lab7
      POSTGRES_PASSWORD: ${LAB7_DB_PASSWORD:?Set LAB7_DB_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab7 -d lab7tests"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    image: kanban-lab7-tests
    environment:
      DATABASE_URL: postgresql://lab7:${LAB7_DB_PASSWORD:?Set LAB7_DB_PASSWORD}@db:5432/lab7tests
    volumes:
      - ./tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -p
      - test_cards.py
      - -v
